set-option -sa terminal-overrides ",xterm*:Tc"

# --- System clipboard sync (incl. nested tmux over SSH, via OSC 52) ---------
# set-clipboard on => accept OSC 52 from programs (including an inner/remote
# tmux) and forward it to the OUTER terminal. tmux's default `external` IGNORES
# OSC 52 from applications, which silently drops the desktop tmux's clipboard at
# the laptop-tmux layer. `on` is what lets a copy on the desktop reach the Mac.
set -g set-clipboard on
# tmux only emits OSC 52 if it believes the terminal supports it; screen/tmux
# TERMs don't claim `clipboard` by default, so advertise it for the TERMs in
# play across the laptop<->desktop chain.
set -as terminal-features ",xterm-256color:clipboard"
set -as terminal-features ",tmux-256color:clipboard"
set -as terminal-features ",screen-256color:clipboard"
set -as terminal-features ",alacritty:clipboard"

#shift + alt + vim keys to swich windows
bind -n M-H previous-window
bind -n M-L next-window

# NOTE: prefix key is set per-machine in the host overlay (sourced at the end):
#   laptop -> C-Space   desktop -> C-a

#mouse
set -g mouse on

#set index to start at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Install/load plugins from inside ~/.config (single location, no ~/.tmux duplicate)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'b0o/tmux-autoreload'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_powerline_icons_theme_enabled on
set -g @catppuccin_l_left_separator ""
set -g @catppuccin_l_right_separator ""
set -g @catppuccin_r_left_separator ""
set -g @catppuccin_r_right_separator ""

#set vi mode
set-window-option -g mode-keys vi
#keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

#split windows into CWD
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Unified switcher (all hosts): fzf popup of local + every Tailscale peer's
# sessions. Locals appear instantly; remotes stream in. See shared/bin/tmux-switch.
bind w display-popup -E -w 75% -h 60% "~/.local/bin/tmux-switch"
# Plain local session/window tree as a no-network fallback.
bind W choose-tree -Zs

run '~/.config/tmux/plugins/tpm/tpm'

# Per-machine overlay LAST so it wins over catppuccin: prefix key, accent
# color, and the machine badge. Linked into place by scripts/link.sh.
source-file -q ~/.config/dotfiles/host.tmux
