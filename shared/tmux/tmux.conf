set-option -sa terminal-overrides ",xterm*:Tc"

# --- Default shell ----------------------------------------------------------
# Pinned per-host in host.tmux (zsh path differs: /opt/homebrew/bin/zsh on mac,
# /usr/bin/zsh on WSL/Linux). Without pinning, tmux freezes $SHELL at
# server-start — under WSL+systemd that's /bin/bash since systemd --user
# doesn't read the passwd shell.

# --- System clipboard sync (incl. nested tmux over SSH, via OSC 52) ---------
# set-clipboard on => accept OSC 52 from programs (including an inner/remote
# tmux) and forward it to the OUTER terminal. tmux's default `external` IGNORES
# OSC 52 from applications, which silently drops the desktop tmux's clipboard at
# the laptop-tmux layer. `on` is what lets a copy on the desktop reach the Mac.
set -g set-clipboard on
# tmux only emits OSC 52 if it believes the terminal supports it; screen/tmux
# TERMs don't claim `clipboard` by default, so advertise it for the TERMs in
# play across the laptop<->desktop chain.
set -as terminal-features ",xterm-256color:clipboard"
set -as terminal-features ",tmux-256color:clipboard"
set -as terminal-features ",screen-256color:clipboard"
set -as terminal-features ",alacritty:clipboard"

#shift + alt + vim keys to swich windows
bind -n M-H previous-window
bind -n M-L next-window

# NOTE: prefix key is set per-machine in the host overlay (sourced at the end):
#   laptop -> C-Space   desktop -> C-a

#mouse
set -g mouse on

#set index to start at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Install/load plugins from inside ~/.config (single location, no ~/.tmux duplicate)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'b0o/tmux-autoreload'

# NOTE: catppuccin/tmux is deliberately NOT a plugin. The status bar below is
# hand-rolled on hardcoded mocha hex values, so it needs nothing from the
# plugin — and tpm's `run-shell` is ASYNC, so catppuccin would finish loading
# *after* this file and silently overwrite the whole bar. Keep it out.

#set vi mode
set-window-option -g mode-keys vi
#keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

#split windows into CWD
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Unified switcher (all hosts): fzf popup of local + every Tailscale peer's
# sessions. Locals appear instantly; remotes stream in. See shared/bin/tmux-switch.
# Gated to LOCAL clients only: when this tmux is reached over SSH (you connected
# in from another machine), the client carries SSH_CONNECTION and the switcher
# is refused — this prevents nesting tmux switchers through one another. The
# switcher therefore only ever works at the physical machine you're sitting at.
bind w if-shell '~/.local/bin/tmux-local-client #{client_pid}' \
  'display-popup -E -w 75% -h 60% "~/.local/bin/tmux-switch"' \
  'display-message "prefix w disabled here (nested/remote session)"'
# Plain local session/window tree as a no-network fallback.
bind W choose-tree -Zs

# New session with a name prompt. Uses -A so if the name already exists it
# attaches instead of appending a number suffix.
bind S command-prompt -p "New session name:" "new-session -A -s '%%'"

run '~/.config/tmux/plugins/tpm/tpm'

# ── Status bar ───────────────────────────────────────────────────────────────
# Hand-rolled on the catppuccin mocha palette (hardcoded hex — no plugin). Set
# AFTER tpm and BEFORE the host overlay, which supplies the two knobs every
# segment reads at draw time:
#   @host_accent  the per-machine accent hex (also used for the pane border)
#   @host_label   the badge text (icon + curated device name)
# Both are #{@…} format refs, expanded at render — after the overlay has run.
# Palette: base #1e1e2e  mantle #181825  crust #11111b  surface0 #313244
#          surface1 #45475a  overlay #6c7086  subtext #a6adc8  text #cdd6f4
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 60
set -g status-right-length 90

# Left: accent device badge ▸ session-name chip, with powerline wings.
set -g status-left "#[fg=#11111b,bg=#{@host_accent},bold] #{@host_label} #[fg=#{@host_accent},bg=#313244,nobold]#[fg=#cdd6f4,bg=#313244]  #S #[fg=#313244,bg=#181825]#[default]"

# Windows: inactive flat & dim; current is an accent pill with powerline wings.
set -g window-status-separator ""
set -g window-status-format "#[fg=#6c7086,bg=#181825]  #I #[fg=#a6adc8]#W#F "
set -g window-status-current-format "#[fg=#{@host_accent},bg=#181825]#[fg=#11111b,bg=#{@host_accent},bold] #I #[fg=#11111b,bg=#{@host_accent},nobold]#W#F #[fg=#{@host_accent},bg=#181825]#[default]"
set -g window-status-activity-style "fg=#f9e2af,bg=#181825"
set -g window-status-bell-style "fg=#f38ba8,bg=#181825,bold"

# Right: date chip ▸ clock chip ▸ accent hostname chip.
set -g status-right "#[fg=#45475a,bg=#181825]#[fg=#bac2de,bg=#45475a]  %a %d %b #[fg=#313244,bg=#45475a]#[fg=#cdd6f4,bg=#313244]  %H:%M #[fg=#{@host_accent},bg=#313244]#[fg=#11111b,bg=#{@host_accent},bold]  #h #[default]"

# Pane borders + messages + copy-mode, tuned to the palette.
set -g pane-border-style "fg=#313244"
set -g message-style "fg=#11111b,bg=#cba6f7,bold"
set -g message-command-style "fg=#cdd6f4,bg=#313244"
set -g mode-style "fg=#11111b,bg=#f9e2af,bold"
set -g clock-mode-colour "#cba6f7"

# Per-machine overlay LAST so it wins over catppuccin: prefix key, accent
# color, and the machine badge. Linked into place by scripts/link.sh.
source-file -q ~/.config/dotfiles/host.tmux
