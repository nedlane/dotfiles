# macOS kitty config: a single Alacritty-style viewport into tmux.

# Launching is done through a startup session so GUI launches can start
# maximized, matching Alacritty's startup_mode = "Maximized".
startup_session main.session

# If kitty is started without the session for any reason, still enter tmux.
shell /Users/nedlane/.local/bin/kitty-tmux-main
close_on_child_death yes

# Font: copied from Alacritty. kitty renders programming ligatures by default;
# keep that explicit so this remains the ligature-capable terminal.
font_family      postscript_name=JetBrainsMonoNFM-Regular features="+calt"
bold_font        postscript_name=JetBrainsMonoNFM-Bold features="+calt"
italic_font      postscript_name=JetBrainsMonoNFM-Italic features="+calt"
bold_italic_font postscript_name=JetBrainsMonoNFM-BoldItalic features="+calt"
font_size 20.0
disable_ligatures never
font_features JetBrainsMonoNFM-Regular +calt
font_features JetBrainsMonoNFM-Bold +calt
font_features JetBrainsMonoNFM-Italic +calt
font_features JetBrainsMonoNFM-BoldItalic +calt

# Viewport feel.
window_padding_width 4
background_opacity 0.95
hide_window_decorations no
cursor_shape block
mouse_hide_wait -1

# Keep kitty from becoming the multiplexer. tmux owns sessions, windows,
# panes, layouts, and navigation.
enabled_layouts stack
tab_bar_style hidden
allow_remote_control no

# macOS behavior copied from Alacritty where kitty has an equivalent.
macos_option_as_alt both
macos_quit_when_last_window_closed yes

# Alacritty exports TERM=xterm-256color. For kitty, keep the native xterm-kitty
# TERM so tmux can detect kitty capabilities; tmux should advertise its own
# terminal inside sessions.

# Do not wipe all shortcuts. Only pass through the most obvious kitty
# multiplexing shortcuts so tmux remains the only window/pane/tab layer.
map cmd+enter no_op
map kitty_mod+enter no_op
map cmd+n no_op
map kitty_mod+n no_op
map cmd+t no_op
map kitty_mod+t no_op
map cmd+w no_op
map kitty_mod+q no_op
map shift+cmd+d no_op
map shift+cmd+w no_op
map kitty_mod+l no_op

# Alacritty binding: Shift+Return sends ESC + CR.
map shift+enter send_text all \x1b\x0d
