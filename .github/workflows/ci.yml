name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Init agent-bridge submodule (best effort)
        id: submod
        # The control plane lives in a separate repo. While it is private the
        # default GITHUB_TOKEN can't clone it, so init is best-effort: on
        # success the control-plane smokes run; otherwise they're skipped and
        # covered by the agent-bridge repo's own CI. (Once it's public this
        # just works.)
        run: |
          if git submodule update --init hosts/wsl-desktop/agent-bridge 2>/dev/null \
             && [ -f hosts/wsl-desktop/agent-bridge/bin/claude-bridge ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::agent-bridge submodule unavailable — skipping control-plane smokes"
          fi

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq lua5.4 shellcheck tmux zsh

      - name: Check repository invariants
        run: ./tests/repository-smoke.sh

      - name: Validate Bash syntax
        run: |
          find scripts tests -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

      - name: Validate Zsh syntax
        run: |
          zsh -n shared/bin/tmux-switch shared/zsh/*.zsh hosts/*/host.zsh hosts/mac/bin/*

      - name: Run ShellCheck
        run: |
          shellcheck scripts/*.sh scripts/lib/*.sh scripts/hooks/* tests/*.sh
          # shared/bin mixes zsh (tmux-switch) and POSIX-sh tools; shellcheck
          # only parses sh/bash, so skip the rest by shebang. The agent-bridge
          # control-plane tools are shellchecked in that submodule's own CI.
          for f in shared/bin/*; do
            head -1 "$f" | grep -qE 'zsh|python' || shellcheck "$f"
          done

      - name: Validate Lua syntax
        run: find shared/nvim -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p

      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@479972f01e665acfcba96ada452c36608bdbbb5e # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.1.0
          args: --check shared/nvim

      - name: Validate Neovim lockfile
        run: jq empty shared/nvim/lazy-lock.json

      - name: Smoke-test linker
        run: ./tests/link-smoke.sh

      - name: Smoke-test tmux switcher
        run: ./tests/tmux-switch-smoke.sh

      - name: Smoke-test tmux-local-client guard
        run: ./tests/tmux-local-client-smoke.sh

      - name: Smoke-test cl wrapper
        run: ./tests/cl-wrapper-smoke.sh

      - name: Smoke-test claude-launch
        run: ./tests/claude-launch-smoke.sh

      # Control-plane smokes exercise the agent-bridge submodule scripts; they
      # run only when the submodule is checked out (see the init step above).
      # When it isn't, coverage falls to the agent-bridge repo's own CI.
      - name: Smoke-test claude-worker
        if: steps.submod.outputs.present == 'true'
        run: ./tests/claude-worker-smoke.sh

      - name: Smoke-test claude-worker-todo-relay
        if: steps.submod.outputs.present == 'true'
        run: ./tests/claude-worker-todo-relay-smoke.sh

      - name: Smoke-test claude-worker-done-relay
        if: steps.submod.outputs.present == 'true'
        run: ./tests/claude-worker-done-relay-smoke.sh

      - name: Smoke-test agent-checkup
        if: steps.submod.outputs.present == 'true'
        run: ./tests/agent-checkup-smoke.sh

      - name: Smoke-test discord-notify
        if: steps.submod.outputs.present == 'true'
        run: ./tests/discord-notify-smoke.sh

      - name: Smoke-test claude-bridge
        if: steps.submod.outputs.present == 'true'
        run: ./tests/claude-bridge-smoke.sh

      - name: Smoke-test bridge-ctl
        if: steps.submod.outputs.present == 'true'
        run: ./tests/bridge-ctl-smoke.sh

      - name: Validate tmux config
        run: |
          home="$(mktemp -d)"
          HOME="$home" XDG_CONFIG_HOME="$home/.config" DOTFILES_DIR="$GITHUB_WORKSPACE" \
            ./scripts/link.sh minipc >/dev/null
          HOME="$home" tmux -L dotfiles_ci -f "$home/.config/tmux/tmux.conf" new-session -d -s ci
          HOME="$home" tmux -L dotfiles_ci kill-server

  link-platforms:
    name: Linker (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Smoke-test all host overlays
        # link-smoke skips the agent-bridge link assertions when the (possibly
        # private) submodule isn't checked out, so it runs without it.
        run: ./tests/link-smoke.sh

  neovim:
    runs-on: ubuntu-latest
    env:
      NVIM_VERSION: v0.12.2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Neovim
        run: |
          curl -fsSLo /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          tar -xzf /tmp/nvim.tar.gz -C /tmp
          echo "/tmp/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Load core Neovim configuration
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/data
          XDG_STATE_HOME: ${{ runner.temp }}/state
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: |
          nvim --headless -u NONE \
            --cmd "set runtimepath+=$GITHUB_WORKSPACE/shared/nvim" \
            --cmd "lua require('config.options'); require('config.keymaps'); require('config.autocmds')" \
            +qa

  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install actionlint
        # Pinned to the v1.7.7 commit (mutable tags can move); matches the
        # SHA-pinning used for every `uses:` action in this workflow.
        run: go install github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7

      - name: Validate workflows
        run: ~/go/bin/actionlint

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
